<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bifrost</title>
<style>
:root{--primary:#03a9f4;--bg:#fafafa;--card:#fff;--text:#212121;--sec:#727272;--div:rgba(0,0,0,.12);--chip:#f2f2f2;--bar:#e6e6e6;
--home:#43a047;--asleep:#7e57c2;--away:#03a9f4;--move:#ffa000;--unk:#9e9e9e;--ok:#43a047;--warn:#ffa000;--err:#db4437}
[data-theme=dark]{--bg:#111;--card:#1c1c1c;--text:#e1e1e1;--sec:#9b9b9b;--div:rgba(225,225,225,.12);--chip:#2a2a2a;--bar:#333}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
.appbar{position:sticky;top:0;z-index:9;background:var(--card);border-bottom:1px solid var(--div)}
.bar-top{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:1150px;margin:0 auto}
.logo{width:28px;height:28px}
.bar-top h1{font-size:19px;font-weight:500}.sp{flex:1}
.iconbtn{border:1px solid var(--div);background:transparent;color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1150px;margin:0 auto;padding:0 8px}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--sec);padding:10px 12px;font-size:14px;cursor:pointer}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
main{max-width:1150px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.12);padding:16px;margin-bottom:12px}
[data-theme=dark] .card,[data-theme=dark] .kpi{box-shadow:none;border:1px solid var(--div)}
.card h2{font-size:16px;font-weight:500;margin-bottom:2px}.hint{font-size:12px;color:var(--sec);margin-bottom:10px}
.banner{background:#e3f2fd;color:#0d47a1;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
[data-theme=dark] .banner{background:#0d2a4a;color:#bbdefb}
.err{background:#ffebee;color:#c62828}[data-theme=dark] .err{background:#7f1d1d;color:#ffcdd2}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.grid .card{margin-bottom:0}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:12px}
.kpi{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.kpi .l{font-size:12px;color:var(--sec)}.kpi .v{font-size:22px;font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--sec);white-space:nowrap}
.tag.on{background:var(--home);color:#fff}.tag.warn{background:#fff3e0;color:#e65100}
.list .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--div)}.list .row:first-child{border-top:none}
.grow{flex:1;min-width:0}.ent{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--sec);overflow-wrap:anywhere;white-space:normal}
.btn{border:1px solid var(--div);background:transparent;color:var(--primary);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:500}
.btn.fill{background:var(--primary);color:#fff;border-color:var(--primary)}
.pbar{height:6px;background:var(--bar);border-radius:3px;overflow:hidden;min-width:50px}.pbar i{display:block;height:100%;border-radius:3px}
.hero{text-align:center;padding:22px 16px}.hero .state{font-size:36px;font-weight:500}.hero .sub{color:var(--sec)}
.gauge{width:160px;height:160px;margin:14px auto;position:relative}.gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:500}
.gauge .val small{font-size:12px;color:var(--sec);font-weight:400}
.why{text-align:left;max-width:560px;margin:10px auto 0}.why .row{padding:6px 0;border-top:1px solid var(--div);display:flex;gap:8px}
.band{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--chip)}.band div{min-width:1px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--sec);margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sec);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:-1px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--div);background:transparent;color:var(--sec);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.filters button.on{background:var(--primary);border-color:var(--primary);color:#fff}
input[type=search],select{border:1px solid var(--div);background:var(--card);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px}
input[type=search]{width:100%;margin-bottom:10px}
.switch{position:relative;width:40px;height:22px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--bar);border-radius:11px;cursor:pointer}
.switch span::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--primary)}.switch input:checked+span::before{transform:translateX(18px)}
.erow{border-top:1px solid var(--div);padding:8px 0}.erow:first-child{border-top:none}
.erow .top{display:flex;gap:10px;align-items:center}
.erow .top>.grow{min-width:0;overflow-wrap:anywhere}.erow .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 0 50px}
.erow .reasons{display:none;font-size:12px;color:var(--sec);background:var(--chip);border-radius:8px;padding:8px 10px;margin:6px 0 0 50px}.erow .reasons.open{display:block}
.ico{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--chip);font-size:14px;flex:0 0 auto}
.empty{color:var(--sec);text-align:center;padding:20px}
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 0 10px}
.step{flex:0 0 auto;min-width:110px;max-width:150px;background:var(--chip);border-radius:10px;padding:8px 10px;font-size:12px}
.step b{display:block;font-size:13px;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.done{outline:2px solid var(--ok)}
.step.out{background:var(--primary);color:#fff}
.gap{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px;font-size:11px;color:var(--sec);min-width:54px}
.gap::before{content:"";display:block;width:100%;height:2px;background:var(--div);margin-bottom:4px}
@media (max-width:640px){.flow{flex-direction:column;overflow:visible}.step{max-width:none;min-width:0}.step b{white-space:normal}.gap{flex-direction:row;justify-content:flex-start;min-width:0;padding:4px 0 4px 18px}.gap::before{width:2px;height:18px;margin:0 8px 0 0}}
.kw{display:inline-block;margin:3px 4px 3px 0;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--chip)}
.kw.away{background:var(--away);color:#fff}
/* ---- 0.4 design system: one look for icons, buttons, chips and cards ---- */
:root{--pri:var(--primary);--in:#12924A;--out:#E06C00;--unc:#9e9e9e;--blk:#2E7D32;--per:#00897B;--rou:#E8337F;--then:#0A6FE6;--and:#7B2FF0;--or:#E8337F;--comp:#00897B;--opt:#8D6E00;--not:#C62828;--panel:#f5f5f5}
[data-theme=dark]{--in:#2FC46A;--out:#FFA040;--blk:#7BD88F;--per:#1FD1C4;--rou:#FF4D9A;--then:#3D96FF;--and:#A66BFF;--or:#FF4D9A;--comp:#1FD1C4;--opt:#E0C04A;--not:#FF6B6B;--panel:#242424}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-3px}
.ic.l{width:22px;height:22px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--div);background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;max-width:100%}
.b:hover{border-color:var(--pri)}.b:focus-visible,.ch:focus-visible,.pc:focus-visible,.tg:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.b.p{background:var(--pri);border-color:var(--pri);color:#fff}
.b.ok{border-color:var(--in);color:var(--in)}.b.ok.p{background:var(--in);color:#fff}
.b.no{border-color:var(--err);color:var(--err)}
.b.ghost{border-color:transparent;background:transparent;color:var(--pri)}
.b.sm{min-height:30px;padding:4px 10px;font-size:12px}
.b[disabled]{opacity:.5;cursor:default}
.bs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ch{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:3px 11px;border-radius:999px;border:1px solid var(--div);background:var(--card);color:var(--text);font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.ch.on{border-color:var(--c,var(--pri));background:color-mix(in srgb,var(--c,var(--pri)) 14%,var(--card));color:var(--c,var(--pri));font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:1px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c,var(--sec)) 55%,transparent);color:var(--c,var(--sec));white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.f{background:var(--c);border-color:var(--c);color:#fff}[data-theme=dark] .pill.f{color:#111}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.frow>.lab{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--sec);min-width:56px}
.sec{font-size:13px;font-weight:700;letter-spacing:.6px;color:var(--sec);margin:18px 2px 8px;text-transform:uppercase}
.av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:var(--c,var(--pri));flex:0 0 auto}
[data-theme=dark] .av{color:#111}
.prow{display:flex;gap:12px;align-items:flex-start}
.prow .grow h3{font-size:15px;font-weight:500;margin:0}
.meta{font-size:12px;color:var(--sec)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--sec);font-weight:500}
.field input[type=text],.field input[type=password],.field select,.inp{border:1px solid var(--div);background:var(--card);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit;min-height:38px;width:100%}
.picks{max-height:200px;overflow:auto;border:1px solid var(--div);border-radius:10px;padding:4px}
.picks label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;font-size:13px;cursor:pointer;min-width:0}
.picks label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picks label:hover{background:var(--panel)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--div)}.check:first-child{border-top:0}
.check .dot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;background:var(--c)}
[data-theme=dark] .check .dot{color:#111}
.prog{height:8px;border-radius:4px;background:var(--bar);overflow:hidden}.prog i{display:block;height:100%;background:var(--c,var(--pri));border-radius:4px}
.empty2{padding:24px;text-align:center;color:var(--sec)}
.qcard{border-left:4px solid var(--c,var(--pri))}
.qcard h3{font-size:15px;font-weight:500;margin:0 0 4px}
.qfacts{font-size:13px;color:var(--sec);margin:4px 0 10px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;font-weight:700;margin-left:4px}
/* pattern recognition */
.list2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.pc{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;text-align:left;border:1px solid var(--div);border-left:5px solid var(--c);border-radius:12px;padding:10px;background:var(--card);color:var(--text);font:inherit;cursor:pointer;width:100%}
.pc .i{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center}
[data-theme=dark] .pc .i{color:#111}
.pc .nm{display:block;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.pc .pv{display:block;font-size:12px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:13px;margin-bottom:8px}
.crumbs .b{min-height:28px;padding:2px 8px}
.st{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--card))}
.st>div{min-width:0}.st .i{width:32px;height:32px;border-radius:10px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center}
[data-theme=dark] .st .i{color:#111}
.st .nm{font-weight:500;overflow-wrap:anywhere}.st .tech{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--sec);overflow-wrap:anywhere}
.st.opt{border-style:dashed}
.lnk{display:flex;align-items:center;gap:8px;margin:0 0 0 16px;padding:3px 0 3px 18px;border-left:2px solid var(--then);font-size:12px;color:var(--sec);min-height:24px;flex-wrap:wrap}
.lnk b{color:var(--then)}
.grp{position:relative;border:2px solid var(--g);border-radius:14px;padding:22px 8px 8px;margin:2px 0;background:color-mix(in srgb,var(--g) 4%,transparent)}
.grp>.gl{position:absolute;top:-1px;left:12px;transform:translateY(-50%);font-size:11px;font-weight:700;letter-spacing:.6px;color:#fff;background:var(--g);padding:2px 10px;border-radius:999px}
[data-theme=dark] .grp>.gl{color:#111}
.grp>.gs{display:grid;gap:6px}
.sp{border:2px solid var(--c);border-radius:12px;background:color-mix(in srgb,var(--c) 6%,var(--card));overflow:hidden}
.sp>.hd{display:grid;grid-template-columns:auto 32px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px}
.tg{border:0;background:transparent;color:var(--c);font-size:15px;cursor:pointer;width:30px;height:30px;border-radius:8px;transition:transform .15s}
.tg[aria-expanded=true]{transform:rotate(90deg)}
.sp>.bd{display:none;padding:6px 10px 10px 16px;margin-left:14px;border-left:2px solid color-mix(in srgb,var(--c) 50%,transparent)}
.sp.open>.bd{display:grid;gap:0}
.comps{border:2px dashed var(--comp);border-radius:14px;padding:8px;margin-top:8px}
.comps>.t{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--comp);margin-bottom:6px}
.tech{display:none}.tech-on .tech{display:block}
/* house map */
.map{width:100%;height:auto;display:block}
.map text{font-size:11px;fill:var(--text)}.map .s{fill:var(--sec)}
.map .lk{stroke:var(--blk);stroke-width:2}.map .ld{stroke:var(--then);stroke-width:2;stroke-dasharray:4 3}
@media(max-width:640px){.list2{grid-template-columns:1fr}.sp>.hd{grid-template-columns:auto 32px minmax(0,1fr)}.sp>.hd .b{grid-column:3;justify-self:start}.frow>.lab{width:100%}.prow{flex-wrap:wrap}
.prow>.grow{flex:1 1 220px;min-width:0}
.prow>.bs{margin-left:auto}}


.seg{display:inline-flex;gap:0;border-radius:16px;overflow:hidden;border:1px solid var(--div);flex:none}
.seg .ch{border:0;border-radius:0;margin:0}
.mpath{border:1px solid var(--div);border-radius:12px;padding:10px 12px;margin-top:10px}
.mpath h3{margin:0 0 8px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mchain{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.mchip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--c);border-radius:16px;padding:2px 10px 2px 2px;max-width:100%;overflow-wrap:anywhere;background:var(--card)}
.mchip .d{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.mchip .d .ic{width:14px;height:14px}
.mchip.door{border-radius:8px}.mchip.door .d{border-radius:5px}
.mchip.dash{border-style:dashed}
.marr{color:var(--sec);font-size:12px;white-space:nowrap;padding:0 2px}
:root{--zin:rgba(67,160,71,.07);--zout:rgba(239,108,0,.07);--wall:#b0b0b0}
[data-theme=dark]{--zin:rgba(102,187,106,.08);--zout:rgba(255,167,38,.08);--wall:#555}

.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.areas .card{margin:0}
.area.live{box-shadow:0 0 0 2px var(--ac)!important}
.check>.grow{min-width:0}
.check.muted{opacity:.6}
.dot .ic.s,.ic.s{width:14px;height:14px}
.tech{overflow-wrap:anywhere;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--sec);line-height:1.5}

.pill .x{border:0;background:transparent;color:inherit;cursor:pointer;padding:0 0 0 4px;font:inherit;line-height:1}
details.more{border:1px solid var(--div);border-radius:10px;padding:8px 12px;margin:8px 0 12px}
details.more summary{cursor:pointer;font-weight:500;font-size:13px}
.field select{max-width:100%}

.check{flex-wrap:wrap}
.check>.grow{flex:1 1 180px}
.srcrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px}
.srcrow select{max-width:100%}
.srcbox{border:1px dashed var(--div);border-radius:10px;padding:8px 10px;margin-top:8px}

.frow .cnt{opacity:.7;font-size:11px;margin-left:2px}
.fsel{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px;align-items:center}
.fsel select{max-width:100%}
.visb{display:flex;gap:3px;margin:6px 0 2px;max-width:220px}.visb i{flex:1;height:6px;border-radius:3px;background:var(--chip,#eee)}.visb i.on{background:var(--c)}
.catg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.catk{border:1px solid var(--div);border-left:3px solid var(--c);border-radius:8px;padding:8px 10px;min-width:0}.catn{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}.catn span{font-size:12px;color:var(--c);overflow-wrap:anywhere}
ol.numl{margin:6px 0 0;padding-left:20px}ol.numl li{margin:4px 0}
/* 0.7 pattern chain – neon accents, follows light/dark */
:root{--n-cyan:#009fd1;--n-mag:#e0008f;--n-lime:#1fae2c;--n-orange:#f57200;--n-violet:#8a2be2;--n-yellow:#c99700;--n-red:#e8173a;--n-teal:#00a38c;--n-blue:#2f6bff;--nglow:none;--nfill:16%}
[data-theme=dark]{--n-cyan:#00e5ff;--n-mag:#ff2bd6;--n-lime:#39ff6a;--n-orange:#ff9a1f;--n-violet:#b86bff;--n-yellow:#ffe14d;--n-red:#ff4d6d;--n-teal:#1de9b6;--n-blue:#4d8dff;--nglow:0 0 10px;--nfill:14%}
.chd{border:1.5px solid var(--hc);border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--hc) 5%,var(--card));box-shadow:var(--nglow) color-mix(in srgb,var(--hc) 45%,transparent);margin-bottom:6px}
.cey{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hc);font-weight:700}
.ctt{font-size:17px;font-weight:500;margin:2px 0}
.cds{font-size:14px;color:var(--sec);margin:0 0 8px}
.ckp{display:flex;flex-wrap:wrap;gap:8px}.ckp div{border:1px solid var(--div);border-radius:8px;padding:5px 10px;background:var(--card);min-width:84px}.ckp b{display:block;font-size:16px;font-weight:500}.ckp span{font-size:12px;color:var(--sec)}
.chn{position:relative;margin-top:12px}
.chn>svg.clines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.crow{position:relative;display:flex;gap:10px;flex-wrap:wrap}

.edrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0 10px 10px;border-bottom:1px solid var(--div);border-left:3px solid var(--c);margin-bottom:2px}.edrow:last-child{border-bottom:0}.edrow.hid{opacity:.55}

.hmsvg.hasplan .hmroom .rf{fill-opacity:.35;filter:none}.hmsvg.hasplan.edit .hmroom .rf{fill-opacity:.12}.hmsvg.hasplan.tool-plan .hmroom .rf{fill-opacity:0}
.hmsvg.hasplan .hmhull .hp{fill-opacity:.15}.hmsvg.hasplan.tool-plan .hmlab{opacity:.5}

.hmrot{margin:6px 0}.edch{margin:6px 0}

.hmtabs{display:none}

<body>
<div class="appbar">
  <div class="bar-top"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#10162c"/><path d="M8 26 A20 20 0 0 1 29 9" stroke="#f44336" stroke-width="3" fill="none"/><path d="M11 27 A17 17 0 0 1 29 12.5" stroke="#ffb300" stroke-width="3" fill="none"/><path d="M14 28 A14 14 0 0 1 29 16" stroke="#29b6f6" stroke-width="3" fill="none"/><path d="M4 24 L9 19.5 L14 24 V29 H4 Z" fill="#fff"/><circle cx="25" cy="6" r="1.6" fill="#ffd54f"/></svg><h1>Bifrost</h1><span class="tag" id="ver"></span><div class="sp"></div><button class="iconbtn" id="infoBtn" type="button" aria-label="Info" title="Info">ⓘ</button><button class="iconbtn" id="themeBtn">Theme: auto</button></div>
  <nav class="tabs" id="tabs"><button data-v="status" class="active">Status</button><button data-v="timeline">Timeline</button><button data-v="dashboard">Dashboard</button><button data-v="patterns">Patterns</button><button data-v="calendars">Calendars</button><button data-v="signals">Signals</button><button data-v="setup">Setup</button></nav>
</div>
<div id="toast" style="display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);color:#fff;padding:10px 16px;border-radius:10px;z-index:20;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>
<main id="main"><div class="empty">Loading…</div></main>
<script>
"use strict";
var S={view:"status",status:null,ents:null,dash:null,tl:null,pats:null,cals:null,filter:"all",q:"",area:"",integ:"",tlcat:"",open:{}};
var STATE={home:["Home","var(--home)"],asleep:["Asleep","var(--asleep)"],away:["Away","var(--away)"],leaving:["Leaving","var(--move)"],arriving:["Arriving","var(--move)"],unknown:["Unknown","var(--unk)"]};
var ROLES=["Evidence","Trigger","Context","Blocker","Noise","Truth","Identity"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function api(path,body){return fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json","X-Bifrost-Request":"1"},body:JSON.stringify(body)}:{}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function catOf(id){var c=S.ents&&S.ents.categories[id];return c||{name:"No category",icon:"❓"};}

function viewStatus(){
  var st=S.status;if(!st)return '<div class="empty">Loading…</div>';
  var h=st.shadow_mode?'<div class="banner">🕶️ Shadow mode – Bifrost only observes and learns. Nothing is triggered.</div>':'';
  if(st.error)h+='<div class="banner err">⚠️ '+esc(st.error)+'</div>';
  var d=st.decision;if(!d)return h+'<div class="card empty">Waiting for the first decision…</div>';
  var s=STATE[d.state]||STATE.unknown,C=2*Math.PI*64,off=C*(1-d.confidence/100);
  h+='<div class="card hero"><div class="state" style="color:'+s[1]+'">'+s[0]+'</div><div class="sub">Updated '+new Date(st.decided_at).toLocaleTimeString()+'</div>'+
   (window.probBlock&&st.probabilities?probBlock(st,d):'<div class="gauge"><svg viewBox="0 0 160 160" width="160" height="160"><circle cx="80" cy="80" r="64" fill="none" stroke="var(--bar)" stroke-width="13"/><circle cx="80" cy="80" r="64" fill="none" stroke="'+s[1]+'" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 80 80)"/></svg><div class="val">'+d.confidence+'%<small>confidence</small></div></div>')+
   '<div class="why"><div class="hint">Why Bifrost thinks so</div>'+d.reasons.map(function(r){return '<div class="row"><span>▸</span><span>'+esc(r)+'</span></div>';}).join("")+'</div></div>';
  if(d.anomaly)h+='<div class="banner" style="background:#fff3e0;color:#e65100">⚠️ Activity while every tracked phone is away – a guest, someone without a phone, or something unusual.</div>';
  h+='<div class="card"><div style="display:flex;align-items:center;gap:10px"><div class="grow"><h2>Guest mode</h2><div class="hint" style="margin:0">While on, Bifrost never says the house is empty. Also available as binary_sensor.bifrost_guest_mode.</div></div><label class="switch"><input type="checkbox" id="guestSw" '+(st.guest_mode?"checked":"")+'><span></span></label></div></div>';
  var hist=st.history||[];
  h+='<div class="card"><h2>Last 24 hours</h2><div class="hint">Detected state over time</div>'+band(hist)+'<div class="axis"><span>-24 h</span><span>-12 h</span><span>now</span></div><div class="legend">'+["home","asleep","away","leaving"].map(function(k){return '<span style="--c:'+STATE[k][1]+'">'+STATE[k][0]+'</span>';}).join("")+'</div></div>';
  return h;
}
function band(hist){
  if(!hist.length)return '<div class="band"></div>';
  var start=Date.now()-864e5,segs=[];
  hist.forEach(function(p,i){var t0=Math.max(start,Date.parse(p.ts)),t1=i+1<hist.length?Date.parse(hist[i+1].ts):Date.now();segs.push([t0,t1,p.state]);});
  var first=segs[0][0];var out='<div style="flex:'+Math.max(0,first-start)+'"></div>';
  segs.forEach(function(s){out+='<div title="'+esc((STATE[s[2]]||STATE.unknown)[0])+'" style="flex:'+Math.max(1,s[1]-s[0])+';background:'+(STATE[s[2]]||STATE.unknown)[1]+'"></div>';});
  return '<div class="band">'+out+'</div>';
}
function viewCalendars(){
  var C=S.cals;if(!C)return '<div class="empty2">…</div>';
  var h='<div class="card"><h2>'+ic("cal")+' '+t("cw_title")+'</h2><div class="hint" style="margin:0">'+t("cw_hint")+(C.enabled?'':' <b>'+t("cw_off")+'</b>')+'</div></div>';
  if(!C.used.length)return h+'<div class="card empty2">'+t("cw_none_used")+'</div>';
  var R=C.read||{};
  h+='<div class="card"><h3>'+t("cr_title")+'</h3>'+(R.at?(R.calendars||[]).map(function(c){return '<div class="check"><span class="dot" style="--c:'+(c.ok?"var(--n-lime)":"var(--err)")+'">'+ic("cal","s")+'</span><div class="grow"><div>'+esc(c.name)+'</div><div class="meta">'+(c.ok?fmtK("cr_entries",{n:c.entries}):t("cr_err"))+'</div></div></div>';}).join("")+
    ((R.almost||[]).length?'<div class="meta" style="margin-top:8px">'+fmtK("cr_almost",{n:C.min_word})+'</div><div class="chips">'+R.almost.map(function(a){return pill(a[0]+" "+a[1]+"/"+C.min_word,"var(--n-orange)");}).join("")+'</div>':""):'<div class="meta">'+t("cr_none")+'</div>')+
    '<div class="meta" style="margin-top:8px">'+fmtK("cr_why",{h:C.hindsight_empty_h==null?0:C.hindsight_empty_h})+(C.next_learn?' · '+fmtK("cr_next",{t:new Date(C.next_learn).toLocaleString()}):"")+'</div></div>';
  if(!C.words.length)return h+'<div class="card empty2">'+t("cw_none").replace("{n}",C.min_word)+'</div>';
  h+='<div class="card">'+C.words.map(function(w){var e=w.effects||{},ef=[];
    if(e.house_empty!=null)ef.push(pill(t("cw_empty").replace("{p}",Math.round(100*e.house_empty)),e.house_empty>=0.85?"var(--away)":"var(--sec)"));
    Object.keys(e.person||{}).forEach(function(n){var x=e.person[n];if(x.means!=="mixed")ef.push(pill(t(x.means==="away"?"cw_person_away":"cw_person_home").replace("{name}",n),x.means==="away"?"var(--away)":"var(--in)"));});
    if(e.day_type)ef.push(pill(t("cw_day"),"var(--opt)"));
    (e.missing||[]).forEach(function(g){ef.push(pill(t("cw_missing").replace("{g}",goalName(g==="departure"?"leaving":g==="arrival"?"arriving":"sleep")),"var(--warn)"));});
    return '<div class="check"><span class="dot" style="--c:var(--opt)">'+ic("cal","s")+'</span><div class="grow"><div><b>'+esc(w.word)+'</b> <span class="meta">'+t("cw_count").replace("{n}",w.count)+' · '+esc((w.calendars||[]).join(", "))+'</span></div><div class="chips">'+ef.join("")+'</div></div></div>';}).join("")+'</div>';
  return h;
}
function bindSetup(){
  var el=document.getElementById("elist");if(!el)return;el.innerHTML=entityRows();
  document.getElementById("scanBtn").onclick=function(){this.textContent="Scanning…";api("api/scan",{}).then(function(){setTimeout(load,4000);});};
  document.getElementById("fArea").onchange=function(e){S.area=e.target.value;el.innerHTML=entityRows();};
  document.getElementById("fInt").onchange=function(e){S.integ=e.target.value;el.innerHTML=entityRows();};
  document.getElementById("q").oninput=function(e){S.q=e.target.value;el.innerHTML=entityRows();};
  document.querySelectorAll("#flt button").forEach(function(b){b.onclick=function(){S.filter=b.dataset.f;render();};});
  el.onclick=function(ev){var row=ev.target.closest(".erow");if(!row)return;var id=row.dataset.id;
    var sn=ev.target.closest("[data-seen]");if(sn){api("api/entities/seen",{entity_id:sn.dataset.seen}).then(function(){S.ents.entities.forEach(function(x){if(x.entity_id===sn.dataset.seen)x.new=false;});S.ents.summary.new=Math.max(0,(S.ents.summary.new||1)-1);render();}).catch(function(e){toast("✗ "+trText(e.message),true);});return;}
    var sw=ev.target.closest(".switch"),box=sw&&sw.querySelector(".inc");
    if(box&&box.disabled){var en=S.ents.entities.filter(function(x){return x.entity_id===id;})[0]||{};toast(t("dis_hint").replace("{by}",trText(en.disabled_by||"")),true);return;}
    if(ev.target.classList.contains("why")){S.open[id]=!S.open[id];row.querySelector(".reasons").classList.toggle("open");}};
  el.onchange=function(ev){if(ev.target.dataset&&(ev.target.dataset.owner!=null||ev.target.dataset.amap!=null))return;var row=ev.target.closest(".erow");if(!row)return;var id=row.dataset.id;
    var inc=row.querySelector(".inc").checked,cat=row.querySelector(".cat").value||null;
    var status=ev.target.classList.contains("inc")?(inc?"included":"ignored"):(inc?"included":"suggested");
    if(status==="included"&&!cat&&!S.ents.entities.filter(function(x){return x.entity_id===id;}).map(function(x){return x.category;})[0]){ev.target.checked=false;toast(trText("Pick a category first – Bifrost does not know what this signal means."),true);return;}
    api("api/entity",{entity_id:id,status:status,category:cat}).then(function(u){S.keep=S.keep||{};S.keep[id]=1;/* a row you just switched stays visible, whatever the filter */toast(u.status==="included"?"Used by Bifrost":u.status==="ignored"?"Ignored":"Saved");S.ents.entities.forEach(function(e,i){if(e.entity_id===id)S.ents.entities[i]=u;});el.innerHTML=entityRows();}).catch(function(e){toast("Could not save ("+e.message+")",true);});};
}
function toast(msg,err){var t=document.getElementById("toast");t.textContent=msg;t.style.background=err?"var(--err)":"var(--ok)";t.style.display="block";clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none";},3500);}
function render(){
  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("active",b.dataset.v===S.view);});
  var m=document.getElementById("main");
  m.innerHTML=S.view==="status"?viewStatus():viewSetup();
  if(S.view==="setup")bindSetup();
  if(S.view==="status"){var g=document.getElementById("guestSw");if(g)g.onchange=function(){api("api/guest",{on:g.checked}).then(function(r){S.status.guest_mode=r.guest_mode;toast(r.guest_mode?"Guest mode on":"Guest mode off");}).catch(function(e){g.checked=!g.checked;toast("Could not save ("+e.message+")",true);});};}
}
function load(){
  Promise.all([api("api/status"),api("api/entities")]).then(function(r){S.status=r[0];S.ents=r[1];document.getElementById("ver").textContent="v"+r[0].version;render();})
   .catch(function(){document.getElementById("main").innerHTML='<div class="card banner err">Could not reach Bifrost. Is the app running?</div>';});
}
document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){S.view=b.dataset.v;render();
  if(S.view==="dashboard")api("api/dashboard").then(function(d){S.dash=d;render();}).catch(function(){});
  if(S.view==="timeline")api("api/timeline").then(function(d){S.tl=d;render();}).catch(function(){});
  if(S.view==="patterns")api("api/patterns").then(function(d){S.pats=d;render();}).catch(function(){});
  if(S.view==="calendars")api("api/calendars").then(function(d){S.cals=d;render();}).catch(function(){});};});
var modes=["auto","light","dark"],mi=0;
function theme(){var m=modes[mi],dark=m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",dark?"dark":"light");document.getElementById("themeBtn").textContent="Theme: "+m;}
document.getElementById("themeBtn").onclick=function(){mi=(mi+1)%3;theme();if(window.trDom)trDom(document.getElementById("themeBtn").parentNode);};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",theme);
theme();load();setInterval(function(){if(S.view==="status")api("api/status").then(function(s){S.status=s;render();}).catch(function(){});},30000);
</script>

 de:{status:"Status",people:"Personen",house:"Haus",recog:"Mustererkennung",dev:"Abweichungen",questions:"Fragen",calendars:"Kalender",signals:"Signale",timeline:"Verlauf",dashboard:"Dashboard",balance:"Bilanz",setup:"Setup",

function uniq(L,k){var o={};L.forEach(function(e){if(e[k])o[e[k]]=1;});return Object.keys(o).sort();}
(function(){try{var f=JSON.parse(localStorage.getItem("bifrost.setupFilter")||"{}");["filter","q","area","integ","floor","dom","sort"].forEach(function(k){if(typeof f[k]==="string")S[k]=f[k];});S.cats=Array.isArray(f.cats)?f.cats:[];S.special=Array.isArray(f.special)?f.special:[];}catch(e){S.cats=[];S.special=[];}})();
S.sort=S.sort||"name";S.floor=S.floor||"";S.dom=S.dom||"";
function saveFilter(){try{localStorage.setItem("bifrost.setupFilter",JSON.stringify({filter:S.filter,q:S.q,area:S.area,integ:S.integ,floor:S.floor,dom:S.dom,sort:S.sort,cats:S.cats,special:S.special}));}catch(e){}}
function eProblem(e){return e.disabled||(!e.available&&!e.disabled);}
function eNoOwner(e){var d=V4.src;if(!d||e.status!=="included")return false;var own=(d.owners||{})[e.entity_id];return ["device_tracker","person","calendar"].indexOf(e.domain)>=0&&e.category!=="vehicles"&&!own;}
function eOpt(e){return !!(V4.opt&&V4.opt.items.some(function(o){return o.entity_id===e.entity_id;}));}
function filterEnts(skip){var E=S.ents,q=(S.q||"").toLowerCase();
  return E.entities.filter(function(e){
    if(skip!=="status"&&!(S.keep&&S.keep[e.entity_id])){var f=S.filter||"all";if(f==="problem"){if(!eProblem(e))return false;}else if(f!=="all"&&e.status!==f)return false;if(f==="all"&&e.status==="ignored"&&!q&&!S.special.length)return false;}
    if(skip!=="cat"&&S.cats.length&&S.cats.indexOf(e.category||"none")<0)return false;
    if(S.floor&&(e.floor||"–")!==S.floor)return false;
    if(S.area&&e.area!==S.area)return false;if(S.integ&&e.integration!==S.integ)return false;if(S.dom&&e.domain!==S.dom)return false;
    if(e.disabled&&S.special.indexOf("disabled")<0)return false;/* entities disabled in HA are hidden unless asked for */
    if(S.special.indexOf("disabled")>=0&&!e.disabled)return false;
    if(S.special.indexOf("new")>=0&&!e.new)return false;
    if(S.special.indexOf("noarea")>=0&&e.area)return false;
    if(S.special.indexOf("noowner")>=0&&!eNoOwner(e))return false;
    if(S.special.indexOf("opt")>=0&&!eOpt(e))return false;
    if(S.special.indexOf("val_nothing")>=0&&!(e.value&&e.value.verdict==="nothing"))return false;
    if(S.special.indexOf("val_slow")>=0&&!(e.value&&e.value.verdict==="slow"))return false;
    return !q||(e.name+" "+e.entity_id+" "+(e.area||"")+" "+(e.integration||"")).toLowerCase().indexOf(q)>=0;});}
function sortEnts(L){var k=S.sort||"name";var key=function(e){return k==="area"?(e.area||"~")+" "+e.name:k==="cat"?(e.category||"~")+" "+e.name:k==="status"?e.status+" "+e.name:k==="changed"?"":e.name;};
  return L.slice().sort(function(a,b){return key(a).toLowerCase()<key(b).toLowerCase()?-1:1;});}

     '<span class="tag">'+esc(e.status)+(e.user_set?" · by you":"")+'</span><span class="tag">guess '+e.confidence+'%</span>'+vPill(e.value)+'<button class="btn why" style="padding:3px 10px;font-size:12px">Why?</button><button type="button" class="btn" data-detail="'+esc(e.entity_id)+'" style="padding:3px 10px;font-size:12px">'+t("dt_btn")+'</button></div>'+

}

  sub_now:"Now",sub_heimdall:"Heimdall",sub_bifrost:"Bifrost",sub_live:"Live map",sub_config:"Configuration",sub_signal:"Signal & calibration",sub_ble:"Bluetooth",sub_happening:"What is happening",

/* [area, colour, [[sub, view]]] – view is the existing render key (S.view) */
var NAV=[["status","--n-cyan",[["now","status"],["heimdall","status"],["bifrost","status"]]],
  ["house","--n-violet",[["live","house"],["config","house"],["signal","house"],["ble","house"],["happening","house"]]],
  ["people","--n-teal",[["people","people"],["moves","people"]]],
  ["recog","--n-mag",[["everyday","recog"],["routines","recog"],["detectors","recog"]]],
  ["safety","--n-orange",[["incidents","dev"],["questions","questions"],["balance","balance"]]],
  ["setup","--n-blue",[["signals","setup"],["entities","setup"],["notify","setup"],["suggest","setup"],["general","setup"]]]];
var LEGACY={dev:["safety","incidents"],questions:["safety","questions"],balance:["safety","balance"]};
var NAVLAST={};try{NAVLAST=JSON.parse(localStorage.getItem("bifrost.nav")||"{}")||{};}catch(e){NAVLAST={};}
S.area=S.area||"status";S.sub=S.sub||"now";
function SM(k){return '<i class="subm" data-sub="'+k+'" hidden></i>';}
function navArea(a){return NAV.filter(function(x){return x[0]===a;})[0];}
function navTarget(v){var p=String(v||"").split("/"),a=p[0],sb=p[1];
  if(LEGACY[a]){sb=sb||LEGACY[a][1];a=LEGACY[a][0];}
  var A=navArea(a);if(!A)return null;
  var subs=A[2].map(function(x){return x[0];});if(subs.indexOf(sb)<0)sb=subs.indexOf(NAVLAST[a])>=0?NAVLAST[a]:subs[0];
  return [a,sb,A[2].filter(function(x){return x[0]===sb;})[0][1]];}
var _goOld=go;
go=function(v){var T=navTarget(v);if(!T){_goOld(v);return;}
  S.area=T[0];S.sub=T[1];NAVLAST[T[0]]=T[1];try{localStorage.setItem("bifrost.nav",JSON.stringify(NAVLAST));}catch(e){}
  if(T[0]==="house"&&["live","config","signal"].indexOf(T[1])>=0&&V4.mtab!==T[1]){V4.mtab=T[1];V4.medit=null;}
  var h="#"+T[0]+"/"+T[1];if(location.hash!==h){try{history.replaceState(null,"",h);}catch(e){}}
  if(S.view===T[2]&&T[2]!=="questions"&&T[2]!=="dev"&&T[2]!=="balance"){livePoll(T[2]==="house");window.scrollTo(0,0);render();return;}
  _goOld(T[2]);window.scrollTo(0,0);};
renderTabs=function(){var nav=document.getElementById("tabs"),q=S.status&&S.status.guard&&S.status.guard.questions;var nq=q?(q.question||0)+(q.suggestion||0):0;
  nav.setAttribute("aria-label",t("nav_menu"));
  nav.innerHTML=NAV.map(function(x){return '<button type="button" data-area="'+x[0]+'" style="--nc:var('+x[1]+')"'+(S.area===x[0]?' class="active" aria-current="page"':'')+'>'+t("nav_"+x[0])+(x[0]==="safety"&&nq?'<span class="badge">'+nq+'</span>':"")+'</button>';}).join("");
  var A=navArea(S.area)||NAV[0],sn=document.getElementById("subtabs");
  if(!sn){sn=document.createElement("nav");sn.id="subtabs";sn.className="subtabs";nav.parentNode.insertBefore(sn,nav.nextSibling);}
  sn.style.setProperty("--nc","var("+A[1]+")");
  sn.innerHTML=A[2].map(function(x){return '<button type="button" data-sub="'+x[0]+'"'+(S.sub===x[0]?' class="on" aria-current="true"':'')+'>'+t("sub_"+x[0])+(x[0]==="questions"&&nq?'<span class="badge">'+nq+'</span>':"")+'</button>';}).join("");
  nav.querySelectorAll("button").forEach(function(b){b.onclick=function(){go(b.dataset.area);};});
  sn.querySelectorAll("button").forEach(function(b){b.onclick=function(){go(S.area+"/"+b.dataset.sub);};});
  var on=sn.querySelector(".on");if(on&&on.scrollIntoView&&sn.scrollWidth>sn.clientWidth)sn.scrollLeft=Math.max(0,on.offsetLeft-sn.clientWidth/2+on.offsetWidth/2);};
TX.de.nav_menu="Bereiche";TX.en.nav_menu="Areas";
function applySub(){var m=document.getElementById("main");if(!m)return;var cur=null,shown=0,sub=S.sub;
  function walk(el){Array.prototype.slice.call(el.children).forEach(function(c){
    if(c.classList.contains("subm")){cur=c.dataset.sub.split(" ");return;}
    if(c.id==="langCard"||c.id==="langCard2"){walk(c);return;}
    if(c.classList.contains("subempty")){c.remove();return;}
    var vis=!cur||cur.indexOf(sub)>=0;c.hidden=!vis;if(vis&&c.textContent.trim())shown++;});}
  walk(m);
  if(!shown&&m.querySelector(".subm"))m.insertAdjacentHTML("beforeend",'<div class="card empty2 subempty">'+esc(t("sub_empty"))+'</div>');}
var _render3=render;
render=function(){_render3();applySub();if(S.view==="house")hmAnimate();
  /* the oldest render step resets .active on #tabs for status/setup – set the area again */
  document.querySelectorAll("#tabs [data-area]").forEach(function(x){x.classList.toggle("active",x.dataset.area===S.area);});};
function navFromHash(){var h=(location.hash||"").replace(/^#/,"");go(h||"status/now");}
window.addEventListener("hashchange",function(){var h=(location.hash||"").replace(/^#/,"");if(h&&h!==S.area+"/"+S.sub)go(h);});
navFromHash();
