configuration:
  update_interval:
    name: Update interval (seconds)
    description: How often Bifrost reads the states from Home Assistant and re-evaluates the home status.
  phone_away_minutes:
    name: Phone away waiting time (minutes)
    description: A phone must be away this long before it counts as "left". Avoids wrong decisions when phones drop Wi-Fi while sleeping.
  no_motion_minutes:
    name: No motion waiting time (minutes)
    description: There must be no motion for this long before the house can be considered empty.
  shadow_mode:
    name: Shadow mode
    description: Bifrost only observes and learns. It never triggers anything. Keep this on until the detection has proven reliable.
  publish_entities:
    name: Publish Bifrost entities
    description: Creates sensor.bifrost_* and binary_sensor.bifrost_* in Home Assistant so you can use them in automations and dashboards.
  use_learning:
    name: Learn from history
    description: >-
      Bifrost learns how reliable each sensor is. Sensors that often fire while the house is empty (pets, robots, drafts) stop counting as activity. Switch off to use only the fixed rules.
  learn_calendars:
    name: Learn from calendars
    description: >-
      Bifrost compares calendar entries with its own decisions to learn which entries mean nobody is home. Full titles are never stored – only single keywords and counts, locally.
  event_stream:
    name: Live events
    description: >-
      Bifrost listens live when a used sensor changes and stores the exact time. This keeps the order (e.g. outside motion → door → inside motion) and short door openings are not missed. Switch off only if there are problems – Bifrost then reads at the interval as before.
  suspicious_entry_level:
    name: Suspicious entry
    description: >-
      What happens when a door is opened from outside while everybody is away or asleep and nothing explains it (no NFC, no known phone; at night Bluetooth/Wi-Fi alone is not enough). 0 = off, 1 = report in the app only, 2 = also turn on binary_sensor.bifrost_suspicious_entry (recommended).
  person_entities:
    name: Person sensors
    description: Creates one sensor.bifrost_person_<id> (home / away / unclear) per person defined in Bifrost. No Home Assistant users are created.
  alarm_signal:
    name: "“House empty confirmed” signal"
    description: >-
      Enables binary_sensor.bifrost_empty_confirmed – the signal that lets e.g. Loxone arm the alarm. Only takes effect once the balance is green (at least 30 days in shadow mode, 20 detected departures, no wrong “empty”). Bifrost never disarms the alarm.
  log_level:
    name: Log level
    description: Amount of detail in the app log.
